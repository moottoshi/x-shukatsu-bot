<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!--
    @tekisei_dojo のプロフィール画像。
    tekisei-drill/assets/og-hero.svg と同じ配色(背景 #09090b / アクセント teal)で揃えている。

    X のタイムライン上では 48px まで縮む。文字やこまかい線は潰れるので、
    要素はマークシートの丸4つと鉛筆だけに絞り、線を太くしてある。
    円形にトリミングされるため、主要な要素は中心 200,200 から半径 160 の内側に置く。
  -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pencil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="#09090b"/>
  <circle cx="200" cy="200" r="200" fill="url(#glow)"/>

  <!-- 全体を中心 200,200 まわりに縮めて、円形トリミングの内側に収める -->
  <g transform="translate(200 200) scale(0.74) translate(-196 -204)">

  <!-- マークシートの丸 2×2。右上だけが塗られている -->
  <g transform="translate(184 186) rotate(-6)">
    <circle cx="-62" cy="-62" r="44" fill="none" stroke="#52525b" stroke-width="11"/>
    <circle cx="-62" cy="62" r="44" fill="none" stroke="#52525b" stroke-width="11"/>
    <circle cx="62" cy="62" r="44" fill="none" stroke="#52525b" stroke-width="11"/>

    <!-- いま塗った丸。外側のリングで「選択した」ことを示す -->
    <circle cx="62" cy="-62" r="66" fill="none" stroke="#14b8a6" stroke-width="6" opacity="0.4"/>
    <circle cx="62" cy="-62" r="44" fill="#2dd4bf"/>
  </g>

  <!-- 鉛筆。芯が塗った丸を指すよう、右下から左上へ -->
  <g transform="translate(292 288) rotate(38)">
    <rect x="-19" y="-172" width="38" height="140" rx="5" fill="url(#pencil)"/>
    <rect x="5" y="-172" width="14" height="140" fill="#d97706" opacity="0.55"/>
    <polygon points="-19,-32 19,-32 0,12" fill="#fcd9a8"/>
    <polygon points="-7,-2 7,-2 0,12" fill="#18181b"/>
    <rect x="-19" y="-188" width="38" height="18" rx="4" fill="#a1a1aa"/>
  </g>

  </g>
</svg>
