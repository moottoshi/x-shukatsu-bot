<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <!--
    @tekisei_dojo のヘッダー。scripts/build-header.mjs が生成する。手で編集しない。
    配色は tekisei-drill/assets/og-hero.svg に合わせている。
  -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pencil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- 左側はアイコンが重なるので、丸を左へいくほど薄くする -->
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="28%" stop-color="#3f3f3f"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="fade">
      <rect width="1500" height="500" fill="url(#fadeLeft)"/>
    </mask>
  </defs>

  <rect width="1500" height="500" fill="#09090b"/>
  <ellipse cx="1010" cy="250" rx="620" ry="330" fill="url(#glow)"/>

  <g mask="url(#fade)">
    <circle cx="300" cy="170" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="378" cy="170" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="456" cy="170" r="24" fill="#2dd4bf"/>
    <circle cx="534" cy="170" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="612" cy="170" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="690" cy="170" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="768" cy="170" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="846" cy="170" r="24" fill="#2dd4bf"/>
    <circle cx="924" cy="170" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="1002" cy="170" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="1080" cy="170" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="1236" cy="170" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="1314" cy="170" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="1392" cy="170" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="300" cy="250" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="378" cy="250" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="456" cy="250" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="534" cy="250" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="612" cy="250" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="690" cy="250" r="24" fill="#2dd4bf"/>
    <circle cx="768" cy="250" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="846" cy="250" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="924" cy="250" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="1002" cy="250" r="24" fill="#2dd4bf"/>
    <circle cx="1080" cy="250" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="1158" cy="250" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="1236" cy="250" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="1314" cy="250" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="1392" cy="250" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="300" cy="330" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="378" cy="330" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="456" cy="330" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="534" cy="330" r="24" fill="#2dd4bf"/>
    <circle cx="612" cy="330" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="690" cy="330" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="768" cy="330" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="846" cy="330" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
    <circle cx="924" cy="330" r="24" fill="none" stroke="#52525b" stroke-width="6"/>
