<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <!-- @tekisei_dojo のヘッダー。scripts/build-images.mjs が生成する。手で編集しない -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="55%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="center" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="halftone" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3" fill="#ffffff" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1500" height="500" fill="url(#bg)"/>
  <g>
    <polygon points="750,250 2050.0,250.0 2026.4,496.5" fill="#ffffff" opacity="0.06"/>
    <polygon points="750,250 1921.3,814.0 1793.1,1025.9" fill="#ffffff" opacity="0.06"/>
    <polygon points="750,250 1560.5,1266.4 1353.1,1401.6" fill="#ffffff" opacity="0.06"/>
    <polygon points="750,250 1039.3,1517.4 793.7,1549.3" fill="#ffffff" opacity="0.06"/>
    <polygon points="750,250 460.7,1517.4 225.7,1439.6" fill="#ffffff" opacity="0.06"/>
    <polygon points="750,250 -60.5,1266.4 -238.5,1094.3" fill="#ffffff" opacity="0.06"/>
    <polygon points="750,250 -421.3,814.0 -507.0,581.8" fill="#ffffff" opacity="0.06"/>
    <polygon points="750,250 -550.0,250.0 -526.4,3.5" fill="#ffffff" opacity="0.06"/>
    <polygon points="750,250 -421.3,-314.0 -293.1,-525.9" fill="#ffffff" opacity="0.06"/>
    <polygon points="750,250 -60.5,-766.4 146.9,-901.6" fill="#ffffff" opacity="0.06"/>
    <polygon points="750,250 460.7,-1017.4 706.3,-1049.3" fill="#ffffff" opacity="0.06"/>
    <polygon points="750,250 1039.3,-1017.4 1274.3,-939.6" fill="#ffffff" opacity="0.06"/>
    <polygon points="750,250 1560.5,-766.4 1738.5,-594.3" fill="#ffffff" opacity="0.06"/>
    <polygon points="750,250 1921.3,-314.0 2007.0,-81.8" fill="#ffffff" opacity="0.06"/>
  </g>
  <rect width="1500" height="500" fill="url(#halftone)"/>
  <rect width="1500" height="500" fill="url(#center)"/>

  <!-- 見出し。ヘッダーで一番読ませたい語を1つだけ大きく -->
  <text x="750" y="235" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="132" font-weight="bold" text-anchor="middle" letter-spacing="4" fill="none" stroke="#0f172a" stroke-width="20" stroke-linejoin="round">適性検査ドリル</text>
  <text x="750" y="235" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="132" font-weight="bold" text-anchor="middle" letter-spacing="4" fill="#fde047">適性検査ドリル</text>

  <!-- 何がもらえるかの一行。
       「毎日1問」とは書かない。初回に投稿した27本のうち適性検査の解説は7本で、
       残りは ES・面接・段取りの話だった。書いてあることと中身がずれると信用を落とす -->
  <text x="750" y="318" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="54" font-weight="bold" text-anchor="middle" letter-spacing="2" fill="none" stroke="#0f172a" stroke-width="10" stroke-linejoin="round">就活のコツを毎日1つ</text>
  <text x="750" y="318" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="54" font-weight="bold" text-anchor="middle" letter-spacing="2" fill="#ffffff">就活のコツを毎日1つ</text>

  <!-- 誰向けかを明記する帯。
       解き方は学年に関係ないので 29卒 まで広げる。30卒は 2026年7月時点で大学1年、
       まだ適性検査を調べていないので入れない(1年後に足す) -->
  <rect x="0" y="382" width="1500" height="76" fill="#09090b" opacity="0.88"/>
  <text x="750" y="434" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="44" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="3">■ 28卒・29卒　SPI・非言語の対策ドリル ■</text>

  <!-- 不安を消すバッジ。tekisei-drill は実際に無料・登録不要なので誇張ではない -->
  <g transform="translate(62 52) rotate(-4)">
    <rect x="0" y="0" width="216" height="78" rx="12" fill="#dc2626" stroke="#7f1d1d" stroke-width="4"/>
    <text x="108" y="55" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="44" font-weight="bold" text-anchor="middle" fill="#ffffff">完全無料</text>
  </g>
  <g transform="translate(1222 52) rotate(4)">
    <rect x="0" y="0" width="216" height="78" rx="12" fill="#dc2626" stroke="#7f1d1d" stroke-width="4"/>
    <text x="108" y="55" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="44" font-weight="bold" text-anchor="middle" fill="#ffffff">登録不要</text>
  </g>
</svg>
